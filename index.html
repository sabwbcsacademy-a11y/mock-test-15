        { question: "ভারতের সংবিধানের কোন তফসিলে দলত্যাগ-বিরোধী আইন রয়েছে?", options: ["অষ্টম", "নবম", "দশম", "একাদশ"], ans: "C" },
        { question: "‘Zero Hour’ সম্পর্কে সঠিক বক্তব্য কোনটি?", options: ["এটি সংবিধানে স্পষ্টভাবে উল্লেখিত", "এটি সংসদের নিয়মে নির্দিষ্টভাবে সংজ্ঞায়িত", "এটি সংসদীয় প্রথা, সংবিধানে উল্লেখ নেই", "এটি শুধুমাত্র রাজ্যসভায় হয়"], ans: "C" },
        { question: "‘Crowding Out Effect’ সাধারণত কোন পরিস্থিতির সঙ্গে সম্পর্কিত?", options: ["সরকারি ঋণগ্রহণের ফলে বেসরকারি বিনিয়োগ হ্রাস", "রপ্তানি বৃদ্ধির ফলে আমদানি বৃদ্ধি", "মুদ্রাস্ফীতি হ্রাস", "বেকারত্ব হ্রাস"], ans: "A" },
        { question: "‘Disguised Unemployment’ ভারতের কোন ক্ষেত্রে বেশি দেখা যায়?", options: ["ভারী শিল্প", "কৃষি", "ব্যাংকিং", "তথ্যপ্রযুক্তি"], ans: "B" },
        { question: "মানুষের চোখে আলোর পরিমাণ নিয়ন্ত্রণ করে কোন অংশ?", options: ["Retina", "Cornea", "Iris", "Optic nerve"], ans: "C" },
        { question: "‘Acetylcholine’ প্রধানত কোন ধরনের জৈব রাসায়নিক পদার্থ?", options: ["হরমোন", "নিউরো ট্রান্সমিটার", "এনজাইম", "অ্যান্টিবডি"], ans: "B" },
        { question: "‘PCR’ প্রযুক্তি মূলত কী কাজে ব্যবহৃত হয়?", options: ["প্রোটিন ভাঙতে", "DNA-এর নির্দিষ্ট অংশের বহু কপি তৈরি করতে", "রক্তচাপ মাপতে", "কোষ ধ্বংস করতে"], ans: "B" },
        { question: "‘Ecological Pyramid’ ধারণাটি কোন বিজ্ঞানীর কাজের সঙ্গে যুক্ত?", options: ["Charles Elton", "Charles Darwin", "Gregor Mendel", "Louis Pasteur"], ans: "A" },
        { question: "‘Dronacharya Award’ কোন ক্ষেত্রে দেওয়া হয়?", options: ["ক্রীড়াবিদদের", "ক্রীড়া প্রশিক্ষকদের", "বিজ্ঞানীদের", "শিক্ষকদের"], ans: "B" },
        { question: "‘Convention on Biological Diversity’ কোন সম্মেলনের সঙ্গে যুক্ত?", options: ["Stockholm Conference", "Rio Earth Summit", "Kyoto Conference", "Montreal Conference"], ans: "B" },
        { question: "‘Chipko Movement’-এর প্রধান উদ্দেশ্য কী ছিল?", options: ["নদী সংরক্ষণ", "বন সংরক্ষণ", "বন্যপ্রাণী শিকার", "খনিজ সম্পদ সংরক্ষণ"], ans: "B" },
        { question: "একজন দোকানদার একটি পণ্য 20% ক্ষতিতে বিক্রি করল। যদি সে পণ্যটি 180 টাকা বেশি দামে বিক্রি করত, তবে 10% লাভ হত। পণ্যটির ক্রয়মূল্য কত?", options: ["500 টাকা", "600 টাকা", "700 টাকা", "800 টাকা"], ans: "B" }
    ];

    const googleSheetUrl = "https://script.google.com/macros/s/AKfycbwghLCs1nkoe_VvaewQbmsi3cygZVILVAa6nDpPriCjUNs5kNbc6omRKLt-DPb1YhpQ3w/exec";

    let studentName = "";
    let studentPhone = "";
    let timeRemaining = 40 * 60; 
    let timerInterval;

    function validateAndStart() {
        const nameInput = document.getElementById('student-name').value.trim();
        const phoneInput = document.getElementById('student-phone').value.trim();
        const errorMsg = document.getElementById('error-msg');

        errorMsg.innerText = "";

        if (!nameInput || !phoneInput) {
            errorMsg.innerText = "দয়া করে নাম এবং মোবাইল নম্বর দুটিই প্রদান করুন।";
            return;
        }

        if (phoneInput.length < 10) {
            errorMsg.innerText = "সঠিক ১০ ডিজিটের মোবাইল নম্বর প্রদান করুন।";
            return;
        }

        studentName = nameInput;
        studentPhone = phoneInput;

        document.getElementById('login-screen').className = 'hidden';
        document.getElementById('quiz-screen').className = '';

        renderQuestions();
        startTimer();
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        questionsData.forEach((item, index) => {
            const qNum = index + 1;
            const optionLetters = ["A", "B", "C", "D"];
            let optionsHTML = '';

            item.options.forEach((opt, i) => {
                optionsHTML += `
                    <label class="options-label" id="label-q${qNum}-${optionLetters[i]}">
                        <input type="radio" name="q${qNum}" value="${optionLetters[i]}">
                        <strong>${optionLetters[i]}.</strong> ${opt}
                    </label>
                `;
            });

            const qBlock = document.createElement('div');
            qBlock.className = 'question-block';
            qBlock.innerHTML = `<h3>প্রশ্ন ${qNum}: ${item.question}</h3>${optionsHTML}`;
            container.appendChild(qBlock);
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeRemaining--;
            let mins = Math.floor(timeRemaining / 60);
            let secs = timeRemaining % 60;
            let formattedMins = mins < 10 ? '0' + mins : mins;
            let formattedSecs = secs < 10 ? '0' + secs : secs;
            document.getElementById('timer').innerText = `সময় বাকি: ${formattedMins}:${formattedSecs}`;

            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                alert("৪০ মিনিট সময় শেষ! আপনার টেস্ট স্বয়ংক্রিয়ভাবে সাবমিট হচ্ছে।");
                submitTest(true);
            }
        }, 1000);
    }

    function submitTest(isAutoSubmit) {
        if (!isAutoSubmit && !confirm("আপনি কি নিশ্চিত টেস্ট সাবমিট করতে চান?")) return;
        clearInterval(timerInterval);

        let correctCount = 0;
        let wrongCount = 0;
        let unansweredCount = 0;

        document.getElementById('quiz-screen').className = 'hidden';
        document.getElementById('result-screen').className = '';

        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '<h2>উত্তরপত্র পর্যালোচনা (Preview)</h2>';

        questionsData.forEach((item, index) => {
            const qNum = index + 1;
            const selectedOpt = document.querySelector(`input[name="q${qNum}"]:checked`);
            const userAns = selectedOpt ? selectedOpt.value : null;

            if (userAns === null) unansweredCount++;
            else if (userAns === item.ans) correctCount++;
            else wrongCount++;

            const cloneBlock = document.getElementsByClassName('question-block')[index].cloneNode(true);
            reviewContainer.appendChild(cloneBlock);

            const correctLabel = reviewContainer.querySelector(`#label-q${qNum}-${item.ans}`);
            if (correctLabel) {
                correctLabel.className += ' correct-ans';
                correctLabel.innerHTML += ' <span class="badge badge-success">সঠিক উত্তর</span>';
            }
            if (userAns && userAns !== item.ans) {
                const wrongLabel = reviewContainer.querySelector(`#label-q${qNum}-${userAns}`);
                if (wrongLabel) {
                    wrongLabel.className += ' wrong-ans';
                    wrongLabel.innerHTML += ' <span class="badge badge-danger">আপনার উত্তর</span>';
                }
            }
        });

        let finalScore = (correctCount * 1) - (wrongCount * 0.25);
        finalScore = Math.max(0, finalScore);

        document.getElementById('result-box').innerHTML = `
            <h3>পরীক্ষার্থীর নাম: ${studentName}</h3>
            <p>মোবাইল নম্বর: ${studentPhone}</p>
            <p style="font-size: 24px; font-weight:bold; color:#1e3a8a;">প্রাপ্ত নম্বর: ${finalScore} / ${questionsData.length}</p>
            <p>সঠিক: <span style="color:green; font-weight:bold;">${correctCount}</span> | ভুল: <span style="color:red; font-weight:bold;">${wrongCount}</span> | উত্তর দেওয়া হয়নি: ${unansweredCount}</p>
        `;

        if (googleSheetUrl) {
            const payload = {
                name: studentName,
                phone: studentPhone,
                score: finalScore,
                correct: correctCount,
                wrong: wrongCount
            };

            fetch(googleSheetUrl, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain"
                },
                body: JSON.stringify(payload)
            })
            .then(() => console.log("Google Sheet-এ সফলভাবে ডাটা পাঠানো হয়েছে!"))
            .catch(err => console.error("Google Sheet Error: ", err));
        }
    }
</script>
